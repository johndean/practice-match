name: Quality

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          set -euo pipefail
          V=8.21.2
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/ && gitleaks version
      - run: gitleaks detect --config .gitleaks.toml --verbose --redact

  backend:
    name: backend (pytest against PostGIS + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env: { POSTGRES_USER: pm, POSTGRES_PASSWORD: pm_dev_pw, POSTGRES_DB: practice_match }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U pm -d practice_match" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://pm:pm_dev_pw@localhost:5433/practice_match
      REDIS_URL: redis://localhost:6380/0
      ENVIRONMENT: test
      API_SECRET_KEY: ci_only_secret_change_me
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # diff-cover (PRs) needs origin/main reachable
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pipx install poetry==2.4.1
      - run: poetry install --no-interaction
      - run: poetry run python scripts/migrate.py
      - run: poetry run ruff check app tests scripts
      - run: poetry run mypy app --strict
      - run: poetry run mypy scripts/migrate.py --strict
      - run: poetry run pytest -q -W error --cov=app --cov-report=xml --cov-fail-under=90
      - run: bash tests/scripts/test_start_sh.sh
      - run: bash tests/scripts/test_verify_image_sh.sh
      - run: bash tests/scripts/test_deploy_guard.sh
      - run: bash tests/scripts/test_verify_deploy.sh
      - name: Coverage on the diff (pull requests only)
        if: github.event_name == 'pull_request'
        run: poetry run diff-cover coverage.xml --compare-branch=origin/main --fail-under=100

  frontend:
    name: frontend (typecheck · unit · build · smoke · visual parity)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx vue-tsc --noEmit -p tsconfig.json
      - name: Generated-from-design drift check
        run: |
          set -euo pipefail
          npm run gen:app
          git diff --exit-code -- src/App.vue src/app.setup.js src/generated/pseudo.css
      - run: npm run build
      # The 100/100/100/100 thresholds (vite.config.ts's test.coverage) already require every
      # test file to run, so this one command replaces the separate plain `vitest run` and the
      # standalone bundle-budget.test.ts run the earlier draft had (both redundant with this).
      - run: npx vitest run --coverage
      - run: npx playwright install --with-deps chromium
      - name: Reference project — generates the oracle (visual baselines + DOM snapshots) from the approved design, this run's Linux Chromium
        run: npx playwright test --config=tests/playwright.config.ts --project=reference
      - name: App project — must match the design (visual, dom, smoke)
        run: npx playwright test --config=tests/playwright.config.ts --project=app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/tests/visual.spec.ts-snapshots
            frontend/tests/dom-snapshots
          retention-days: 14

  coming-soon:
    name: coming-soon (unit at 100% · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: coming-soon }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: coming-soon/package-lock.json }
      - run: npm ci
      - run: npx vitest run --coverage
      - run: npm run build
