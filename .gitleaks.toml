# Gitleaks — Practice Match. Direct binary in CI (not the paid Action for orgs).
title = "Practice Match gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholders in example/test files; design-reference is vendored design source"
regexTarget = "line"   # the regexes below describe the whole fixture line, not only the captured value
paths = [
  '''(?i)\.env\.example$''',
  '''(?i)^docs/design-reference/.*''',
  '''(?i)^frontend/tests/visual\.spec\.ts-snapshots/.*''',
]
regexes = [
  '''pm_dev_pw''',
  '''test_only_secret_change_me''',
  '''ci_only_secret_change_me''',
  '''local_only''',
  '''"CENSUS_API_KEY", "the-key"''',
  '''"CENSUS_API_KEY", "distinctive-key-123"''',
  '''postgresql://nobody@127\.0\.0\.1:1/none''',
]
