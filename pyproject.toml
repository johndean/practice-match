[project]
name = "practice-match"
version = "0.1.12"
description = "VIN Foundation veterinary practice marketplace — API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "psycopg2-binary>=2.9",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "structlog>=24.4",
  "greenlet>=3.0",  # explicit: SQLAlchemy's platform marker omits arm64 and Poetry 2.4.1 does not honour the asyncio-extra marker (John's ruling 2026-09-05)
  "anyio>=4.0",  # explicit: app/auth/passwords.py calls anyio.to_thread.run_sync directly; previously only a transitive dep of httpx/starlette (I2 review M5)
  "argon2-cffi (>=25.1.0,<26.0.0)",
  "zxcvbn (>=4.5.0,<5.0.0)",
  "boto3 (>=1.43.89,<2.0.0)",
  # The photograph pipeline, on the REQUEST PATH since the seller listing lifecycle (spec
  # 2026-09-08 D15): `app/media/encode.py` EXIF-transposes, flattens, resizes, strips every
  # metadatum and re-encodes a seller's upload to WebP before a byte reaches object storage.
  # Stripping a phone photograph's GPS is what keeps "Sellers control what buyers can see" true
  # for a listing whose location is undisclosed, so it cannot wait for a hand-run script — which
  # is why this is a MAIN dependency now and no longer dev-only (`scripts/prepare_photos.py`
  # imports the same module). Controller ruling A-SL6, Task SL2.
  "pillow>=11.0",
  # Multipart form parsing, for the seller's photograph and document uploads (spec 2026-09-08 D15,
  # D18). Starlette's `Request.form()` asserts this library is installed before it will read a
  # `multipart/form-data` body, and `app/api/seller_listings.py`'s five asset routes are the first
  # in this codebase to take one. FastAPI ships it only inside the `standard` extra, which this
  # project does not install, so it is named here as the runtime dependency it now is.
  "python-multipart>=0.0.20",
  "pyshp (>=3.1.6,<4.0.0)",
  "shapely (>=2.1.2,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
mypy = ">=1.13"
types-psycopg2 = ">=2.9"
pyyaml = "^6.0.3"
ruff = "0.16.6"
pytest-cov = "7.1.0"
diff-cover = "10.5.1"
fakeredis = {extras = ["aioredis"], version = "^2.37.1"}
types-zxcvbn = "^4.5.0.20260518"
moto = {extras = ["s3"], version = "^5.2.3"}
boto3-stubs = {extras = ["s3"], version = "^1.43.89"}
types-shapely = "^2.1.0.20260728"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
concurrency = ["thread", "greenlet"]

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
# No `select` key: ruff's own default rule set stays active (it already includes
# pyflakes/pycodestyle plus a broad "recommended" set — RUF and PLW among them).
# extend-select only guarantees I (isort) and RUF are on, per policy; no ignores.
extend-select = ["I", "RUF"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
