[project]
name = "practice-match"
version = "0.1.1"
description = "VIN Foundation veterinary practice marketplace — API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "psycopg2-binary>=2.9",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "structlog>=24.4",
  "greenlet>=3.0",  # explicit: SQLAlchemy's platform marker omits arm64 and Poetry 2.4.1 does not honour the asyncio-extra marker (John's ruling 2026-09-05)
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
mypy = ">=1.13"
types-psycopg2 = ">=2.9"
pyyaml = "^6.0.3"
ruff = "0.16.6"
pytest-cov = "7.1.0"
diff-cover = "10.5.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
concurrency = ["thread", "greenlet"]

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
# No `select` key: ruff's own default rule set stays active (it already includes
# pyflakes/pycodestyle plus a broad "recommended" set — RUF and PLW among them).
# extend-select only guarantees I (isort) and RUF are on, per policy; no ignores.
extend-select = ["I", "RUF"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
